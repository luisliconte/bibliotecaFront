<div class="table-container container-fluid">
  <div class="mt-2">
    <div class="d-flex justify-content-between">
      <h4 class="fw-bold">Lista de Autor</h4>
      <button type="button" class="btn btn-primary" (click)="accion(0, '')">Nuevo autor</button>
    </div>
  </div>
  <hr>
  <mat-form-field style="width: 40%;">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Buscar" #input>
  </mat-form-field>
  <table mat-table [dataSource]="autorData" matSort class="mat-elevation-z8">
    <!-- idAutor -->
    <ng-container matColumnDef="idAutor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Id Autor </th>
      <td mat-cell *matCellDef="let row"> {{ row.idAutor }} </td>
    </ng-container>

    <!-- nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
      <td mat-cell *matCellDef="let row"> {{ row.nombre }} </td>
    </ng-container>

    <!-- nacionalidad -->
    <ng-container matColumnDef="nacionalidad">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nacionalidad </th>
      <td mat-cell *matCellDef="let row"> {{ row.nacionalidad }} </td>
    </ng-container>

    <!-- fechaNacimiento -->
    <ng-container matColumnDef="fechaNacimiento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha Nacimiento </th>
      <td mat-cell *matCellDef="let row"> {{ row.fechaNacimiento }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="accion(row.idAutor, 'editar')">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="accion(row.idAutor, 'eliminar')">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
